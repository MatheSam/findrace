<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Corridas — explorador de manifestazioni</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17211d; background: #f3f5f1; font-synthesis: none; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { background: #153b32; color: #f5f8f4; padding: 26px max(22px, calc((100% - 1200px) / 2)); }
    header h1 { margin: 0 0 6px; font-size: clamp(1.5rem, 3vw, 2rem); letter-spacing: -.03em; }
    header p { margin: 0; color: #d1e1d9; }
    main { width: min(1200px, calc(100% - 32px)); margin: 24px auto 48px; }
    .panel, .event { background: white; border: 1px solid #e0e6df; border-radius: 14px; box-shadow: 0 3px 14px #193b3210; }
    .import-panel { padding: 18px; margin-bottom: 18px; }
    .header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .language-control { display: flex; align-items: center; gap: 8px; color: #d1e1d9; font-size: .88rem; }
    .language-control select { padding: 7px 9px; border: 1px solid #ffffff55; border-radius: 8px; color: #17211d; background: white; }
    .import-panel h2, .filters h2 { margin: 0 0 13px; font-size: 1rem; }
    .import-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    input, select, button, textarea { font: inherit; }
    button, .file-button { border: 0; border-radius: 9px; padding: 10px 14px; background: #17684f; color: white; font-weight: 650; cursor: pointer; }
    button:hover, .file-button:hover { background: #10543f; }
    button.secondary { color: #214337; background: #e8f1eb; }
    button.secondary:hover { background: #dce9df; }
    input[type=file] { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    .file-button { display: inline-block; }
    .status { color: #52635a; font-size: .9rem; }
    details { margin-top: 13px; }
    summary { color: #17684f; cursor: pointer; font-weight: 600; }
    textarea { display: block; width: 100%; min-height: 145px; margin: 11px 0; padding: 12px; border: 1px solid #ccd7ce; border-radius: 9px; resize: vertical; }
    .layout { display: grid; grid-template-columns: 255px minmax(0, 1fr); gap: 18px; align-items: start; }
    .filters { padding: 18px; position: sticky; top: 14px; max-height: calc(100vh - 28px); display: flex; flex-direction: column; min-height: 0; }
    .filters h2 { flex: 0 0 auto; }
    .filter-content { overflow-y: auto; min-height: 0; padding-right: 4px; }
    .field { display: grid; gap: 6px; margin: 0 0 13px; }
    .field label { color: #45564c; font-size: .84rem; font-weight: 650; }
    .field input, .field select { width: 100%; min-width: 0; padding: 9px 10px; border: 1px solid #d4ddd5; border-radius: 8px; background: #fff; color: #17211d; }
    .check { display: flex; align-items: center; gap: 8px; margin: 10px 0; color: #35483e; font-size: .9rem; }
    .check input { accent-color: #17684f; }
    .filter-buttons { display: flex; gap: 8px; margin-top: 16px; position: sticky; bottom: 0; padding-top: 10px; background: #fff; flex: 0 0 auto; }
    .filter-buttons button { flex: 1; padding: 9px; }
    .results-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline; margin: 2px 2px 12px; }
    .results-head strong { font-size: 1.05rem; }
    .results-head span { color: #64736a; font-size: .9rem; }
    #results { display: grid; gap: 13px; }
    .event { padding: 0; overflow: hidden; }
    .event-top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; padding: 19px 20px 15px; }
    .event-heading { min-width: 0; }
    .event h3 { margin: 0; font-size: 1.2rem; line-height: 1.3; letter-spacing: -.015em; text-transform: uppercase; }
    .event-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 11px 0 0; color: #52635a; font-size: .88rem; text-transform: uppercase; }
    .event-meta span { display: inline-flex; align-items: center; gap: 6px; }
    .event-meta .meta-icon { color: #17684f; font-size: .95rem; }
    .badge { display: inline-flex; align-items: center; padding: 4px 8px; border-radius: 99px; background: #e8f2eb; color: #246047; font-size: .75rem; font-weight: 700; white-space: nowrap; }
    .badge.blue { background: #e8eff9; color: #355b8b; }
    .organizer { display: flex; gap: 10px; align-items: center; margin: 0 20px 15px; padding-top: 13px; border-top: 1px solid #edf0eb; color: #52635a; font-size: .86rem; }
    .organizer img { width: 34px; height: 34px; padding: 3px; object-fit: contain; border: 1px solid #edf0eb; border-radius: 50%; background: #fff; }
    .event-links { margin: 0 20px 14px; }
    .races { display: grid; gap: 10px; margin: 0; padding: 0 12px 12px; list-style: none; }
    .race { padding: 15px 16px; border: 1px solid #e8ede7; border-radius: 12px; background: #f8faf7; }
    .race-title { font-weight: 700; font-size: 1rem; line-height: 1.4; text-transform: uppercase; }
    .race-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .race-meta span { padding: 5px 9px; border: 1px solid #e1e7e1; border-radius: 8px; color: #4e5f55; background: white; font-size: .78rem; }
    .race-meta span.race-status { border-color: #cfe4d5; background: #eaf4ed; color: #246047; font-weight: 650; }
    .links { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 13px; padding-top: 11px; border-top: 1px solid #e9eee8; }
    a { color: #17684f; font-size: .83rem; font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .empty { padding: 28px; text-align: center; color: #64736a; }
    .mobile-filter-toggle, .back-to-top, .filter-scrim { display: none; }
    @media (max-width: 760px) {
      header { padding: 22px 18px; }
      .header-row { align-items: center; }
      main { width: min(100% - 24px, 600px); margin: 16px auto 32px; }
      .layout { grid-template-columns: minmax(0, 1fr); gap: 14px; }
      .mobile-filter-toggle { display: block; position: fixed; z-index: 20; right: 16px; bottom: 18px; min-height: 48px; padding: 12px 18px; border-radius: 999px; box-shadow: 0 5px 18px #102b2370; }
      .filter-scrim { display: block; position: fixed; z-index: 29; inset: 0; background: #102b2370; opacity: 0; visibility: hidden; transition: opacity .2s, visibility .2s; }
      .filters { position: fixed; z-index: 30; top: 0; right: 0; bottom: 0; width: min(88vw, 390px); max-height: none; padding: 20px; border-radius: 16px 0 0 16px; box-shadow: -8px 0 30px #102b2325; transform: translateX(105%); transition: transform .24s ease; }
      body.filters-open { overflow: hidden; }
      body.filters-open .filters { transform: translateX(0); }
      body.filters-open .filter-scrim { opacity: 1; visibility: visible; }
      .filter-content { overflow-y: auto; padding: 0 4px 8px 0; }
      .filter-buttons { position: sticky; bottom: 0; padding: 12px 0 0; background: #fff; }
      .back-to-top { display: block; position: fixed; z-index: 20; left: 16px; bottom: 18px; width: 48px; height: 48px; padding: 0; border-radius: 50%; box-shadow: 0 5px 18px #102b2345; opacity: 0; visibility: hidden; transform: translateY(8px); transition: .2s; }
      .back-to-top.visible { opacity: 1; visibility: visible; transform: translateY(0); }
      .import-panel { padding: 16px; }
      .import-actions { align-items: stretch; }
      .import-actions > button, .import-actions > .file-button { flex: 1 1 calc(50% - 10px); text-align: center; }
      .status { flex: 1 0 100%; }
      .event-top { padding: 16px 16px 13px; }
      .organizer { margin: 0 16px 13px; }
      .event-links { margin: 0 16px 12px; }
      .races { padding: 0 8px 8px; }
      .race { padding: 13px; }
      .event-top { gap: 8px; }
    }
    @media (max-width: 420px) {
      main { width: calc(100% - 20px); margin-top: 12px; }
      header { padding: 20px 14px; }
      .import-actions > button, .import-actions > .file-button { flex-basis: 100%; }
      .event-top { flex-direction: column; }
      .event h3 { font-size: 1rem; }
      .results-head { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-row">
      <div><h1 data-i18n="title">Esplora le manifestazioni</h1><p data-i18n="subtitle">Carica il JSON di <code>manifestazioni</code> e trova eventi e gare con i filtri.</p></div>
      <label class="language-control"><span data-i18n="language">Lingua</span><select id="language" aria-label="Lingua"><option value="it">Italiano</option><option value="en">English</option></select></label>
    </div>
  </header>
  <main>
    <section class="panel import-panel" aria-labelledby="import-title">
      <h2 id="import-title" data-i18n="data">Dati</h2>
      <div class="import-actions">
        <label class="file-button" for="file" data-i18n="chooseJson">Scegli file JSON</label>
        <input id="file" type="file" accept=".json,application/json">
        <button id="paste-toggle" class="secondary" type="button" data-i18n="pasteJson">Incolla JSON</button>
        <button id="fetch-button" class="secondary" type="button" title="Prova a consultare l'API nel browser" data-i18n="fetchApi">Recupera dall'API</button>
        <span id="status" class="status" role="status" data-i18n="noData">Nessun dato caricato.</span>
      </div>
      <details id="paste-area">
        <summary data-i18n="pasteHint">Incolla o controlla il JSON</summary>
        <textarea id="json-input" spellcheck="false" data-i18n-placeholder="jsonPlaceholder" placeholder='Incolla qui la risposta completa, ad esempio: { "manifestazioni": [...] }'></textarea>
        <button id="load-paste" type="button" data-i18n="loadPasted">Carica JSON incollato</button>
      </details>
    </section>
    <div class="layout">
      <aside id="filters-panel" class="panel filters" aria-labelledby="filter-title" aria-hidden="false">
        <h2 id="filter-title" data-i18n="filters">Filtri</h2>
        <div class="filter-content">
        <div class="field"><label for="search" data-i18n="searchLabel">Nome, località o organizzatore</label><input id="search" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="Es.: Torino, mezza, A.S.D."></div>
        <div class="field"><label for="locality" data-i18n="locality">Località</label><select id="locality"><option value="" data-i18n="allFem">Tutte</option></select></div>
        <div class="field"><label for="province" data-i18n="province">Provincia</label><select id="province"><option value="" data-i18n="allFem">Tutte</option></select></div>
        <div class="field"><label for="from-date" data-i18n="fromDate">Data di inizio</label><input id="from-date" type="date"></div>
        <div class="field"><label for="to-date" data-i18n="toDate">Data di fine</label><input id="to-date" type="date"></div>
        <div class="field"><label for="weekday" data-i18n="weekday">Giorno della settimana</label><select id="weekday"><option value="" data-i18n="allMasc">Tutti</option></select></div>
        <div class="field"><label for="race-search" data-i18n="raceName">Nome della gara</label><input id="race-search" type="search" data-i18n-placeholder="racePlaceholder" placeholder="Es.: 10 km, competitiva"></div>
        <label class="check"><input id="competitive" type="checkbox" data-i18n-aria="competitive"> <span data-i18n="competitive">Solo gare competitive</span></label>
        <label class="check"><input id="certified" type="checkbox"> <span data-i18n="certified">Solo gare certificate</span></label>
        <label class="check"><input id="national" type="checkbox"> <span data-i18n="national">Solo gare nazionali</span></label>
        </div>
        <div class="filter-buttons"><button id="clear-filters" class="secondary" type="button" data-i18n="clearFilters">Cancella filtri</button></div>
      </aside>
      <section aria-label="Risultati" data-i18n-aria="results">
        <div class="results-head"><strong id="count">0 eventi</strong><span id="race-count">0 gare</span></div>
        <div id="results"><div class="panel empty" data-i18n="initialEmpty">Carica un file o incolla un JSON per iniziare.</div></div>
      </section>
    </div>
  </main>
  <div id="filter-scrim" class="filter-scrim" aria-hidden="true"></div>
  <button id="mobile-filter-toggle" class="mobile-filter-toggle" type="button" aria-controls="filters-panel" aria-expanded="false" data-i18n="filters">Filtri</button>
  <button id="back-to-top" class="back-to-top" type="button" aria-label="Torna all'inizio" title="Torna all'inizio" data-i18n-aria="backToTop" data-i18n-title="backToTop">↑</button>
  <script>
    const $ = (selector) => document.querySelector(selector);
    const translations = {
      it: {
        title: 'Esplora le manifestazioni', subtitle: 'Carica il JSON di <code>manifestazioni</code> e trova eventi e gare con i filtri.', language: 'Lingua', data: 'Dati', chooseJson: 'Scegli file JSON', pasteJson: 'Incolla JSON', fetchApi: "Recupera dall'API", fetchApiTitle: "Prova a consultare l'API nel browser", noData: 'Nessun dato caricato.', pasteHint: 'Incolla o controlla il JSON', jsonPlaceholder: 'Incolla qui la risposta completa, ad esempio: { "manifestazioni": [...] }', loadPasted: 'Carica JSON incollato', filters: 'Filtri', searchLabel: 'Nome, località o organizzatore', searchPlaceholder: 'Es.: Torino, mezza, A.S.D.', locality: 'Località', province: 'Provincia', allFem: 'Tutte', allMasc: 'Tutti', fromDate: 'Data di inizio', toDate: 'Data di fine', weekday: 'Giorno della settimana', raceName: 'Nome della gara', racePlaceholder: 'Es.: 10 km, competitiva', competitive: 'Solo gare competitive', certified: 'Solo gare certificate', national: 'Solo gare nazionali', clearFilters: 'Cancella filtri', results: 'Risultati', initialEmpty: 'Carica un file o incolla un JSON per iniziare.', backToTop: "Torna all'inizio", noResults: 'Nessun evento corrisponde ai filtri.', event: 'evento', events: 'eventi', race: 'gara', races: 'gare', eventUnnamed: 'Manifestazione senza nome', raceUnnamed: 'Gara senza nome', organizerSite: "Sito dell'organizzazione", competitiveBadge: 'Competitiva', certifiedBadge: 'Certificata', nationalBadge: 'Nazionale', site: 'Sito', flyer: 'Volantino', map: 'Google Maps', meetingHour: 'Ritrovo', start: 'Partenza', loaded: 'Dati caricati', pastedLabel: 'JSON incollato', loadedNamed: '{label}: {count} {noun}.', invalidFormat: 'Formato non riconosciuto. Il JSON deve contenere una lista "manifestazioni".', apiLoading: "Richiesta all'API in corso…", apiInvalid: 'La risposta API non è un JSON valido. Il testo è disponibile qui sotto.', apiError: "Impossibile recuperare i dati dall'API ({error}). Il browser potrebbe bloccare la richiesta per CORS o richiedere una sessione. Scarica il JSON e importalo.", fileError: 'Impossibile leggere il file: {error}', pasteError: 'JSON non valido: {error}'
      },
      en: {
        title: 'Race explorer', subtitle: 'Load the <code>manifestazioni</code> JSON and find events and races with filters.', language: 'Language', data: 'Data', chooseJson: 'Choose JSON file', pasteJson: 'Paste JSON', fetchApi: 'Fetch from API', fetchApiTitle: 'Try to fetch data from the API in your browser', noData: 'No data loaded.', pasteHint: 'Paste or inspect JSON', jsonPlaceholder: 'Paste the complete response here, for example: { "manifestazioni": [...] }', loadPasted: 'Load pasted JSON', filters: 'Filters', searchLabel: 'Name, location, or organizer', searchPlaceholder: 'E.g. Torino, half marathon, A.S.D.', locality: 'Location', province: 'Province', allFem: 'All', allMasc: 'All', fromDate: 'Start date', toDate: 'End date', weekday: 'Day of the week', raceName: 'Race name', racePlaceholder: 'E.g. 10 km, competitive', competitive: 'Competitive races only', certified: 'Certified races only', national: 'National races only', clearFilters: 'Clear filters', results: 'Results', initialEmpty: 'Load a file or paste JSON to get started.', backToTop: 'Back to top', noResults: 'No events match the filters.', event: 'event', events: 'events', race: 'race', races: 'races', eventUnnamed: 'Unnamed event', raceUnnamed: 'Unnamed race', organizerSite: 'Organizer website', competitiveBadge: 'Competitive', certifiedBadge: 'Certified', nationalBadge: 'National', site: 'Website', flyer: 'Flyer', map: 'Google Maps', meetingHour: 'Meeting point', start: 'Start', loaded: 'Data loaded', pastedLabel: 'Pasted JSON', loadedNamed: '{label}: {count} {noun}.', invalidFormat: 'Unrecognized format. The JSON must contain a "manifestazioni" list.', apiLoading: 'Contacting the API…', apiInvalid: 'The API response is not valid JSON. The text is available below.', apiError: 'Could not fetch the API ({error}). The browser may block the request because of CORS or require a session. Download and import the JSON.', fileError: 'Could not read the file: {error}', pasteError: 'Invalid JSON: {error}'
      }
    };
    let currentLanguage = 'it';
    const t = (key, values = {}) => Object.entries(values).reduce((value, [name, replacement]) => value.replaceAll(`{${name}}`, replacement), translations[currentLanguage][key] || key);
    function applyLanguage(language) {
      currentLanguage = translations[language] ? language : 'it';
      document.documentElement.lang = currentLanguage;
      document.title = currentLanguage === 'it' ? 'Corse — esplora le manifestazioni' : 'Races — event explorer';
      document.querySelectorAll('[data-i18n]').forEach(element => { element.innerHTML = t(element.dataset.i18n); });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(element => { element.placeholder = t(element.dataset.i18nPlaceholder); });
      document.querySelectorAll('[data-i18n-aria]').forEach(element => { element.setAttribute('aria-label', t(element.dataset.i18nAria)); });
      document.querySelectorAll('[data-i18n-title]').forEach(element => { element.title = t(element.dataset.i18nTitle); });
      $('#fetch-button').title = t('fetchApiTitle');
      if ($('#status').dataset.statusKey) {
        const values = JSON.parse($('#status').dataset.statusValues || '{}');
        if ($('#status').dataset.statusKey === 'loadedNamed') values.noun = values.count === 1 ? t('event') : t('events');
        $('#status').textContent = t($('#status').dataset.statusKey, values);
      } else if (!events.length) $('#status').textContent = t('noData');
      render();
    }
    let events = [];
    const status = $('#status');
    const text = (value) => value == null ? '' : String(value);
    const esc = (value) => text(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
    const safeUrl = (value) => {
      try { const url = new URL(value); return ['http:', 'https:'].includes(url.protocol) ? url.href : ''; }
      catch { return ''; }
    };
    const dateValue = (value) => {
      const match = text(value).match(/^(\d{4})-(\d{2})-(\d{2})/);
      return match ? `${match[1]}-${match[2]}-${match[3]}` : '';
    };
    const formatDate = (value) => {
      const iso = dateValue(value);
      if (!iso) return text(value);
      const [year, month, day] = iso.split('-');
      const time = text(value).match(/\b(\d{2}:\d{2})/);
      return `${day}/${month}/${year}${time ? ` ${time[1]}` : ''}`;
    };
    const isTrue = (value) => value === true || value === 1 || value === '1' || value === 'true';
    function setTodayAsStartDate() {
      const today = new Date();
      const localDate = new Date(today.getTime() - today.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
      $('#from-date').value = localDate;
    }
    function extractEvents(data) {
      const list = Array.isArray(data) ? data : data && Array.isArray(data.manifestazioni) ? data.manifestazioni : null;
      if (!list) throw new Error(t('invalidFormat'));
      return list.filter((item) => item && typeof item === 'object').map((item) => ({ ...item, gare: Array.isArray(item.gare) ? item.gare : [] }));
    }
    function setData(data, label = null) {
      try {
        events = extractEvents(data);
        populateOptions();
        label = label || t('loaded');
        status.dataset.statusKey = 'loadedNamed';
        status.dataset.statusValues = JSON.stringify({ label, count: events.length, noun: events.length === 1 ? t('event') : t('events') });
        status.textContent = t('loadedNamed', { label, count: events.length, noun: events.length === 1 ? t('event') : t('events') });
        render();
      } catch (error) { status.dataset.statusKey = 'invalidFormat'; status.dataset.statusValues = '{}'; status.textContent = error.message; }
    }
    function populateOptions() {
      const localities = [...new Set(events.map(e => text(e.localita).trim()).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'it'));
      const provinces = [...new Set(events.map(e => text(e.provincia).trim()).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'it'));
      const weekdays = [...new Set(events.map(e => text(e.dayofweek).trim()).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'it'));
      $('#locality').innerHTML = `<option value="">${t('allFem')}</option>` + localities.map(v => `<option value="${esc(v.toLocaleLowerCase())}">${esc(v)}</option>`).join('');
      $('#province').innerHTML = `<option value="">${t('allFem')}</option>` + provinces.map(v => `<option value="${esc(v.toLowerCase())}">${esc(v.toUpperCase())}</option>`).join('');
      $('#weekday').innerHTML = `<option value="">${t('allMasc')}</option>` + weekdays.map(v => `<option value="${esc(v.toLowerCase())}">${esc(v)}</option>`).join('');
    }
    function matches(event) {
      
      const query = $('#search').value.trim().toLocaleLowerCase();
      const raceQuery = $('#race-search').value.trim().toLocaleLowerCase();
      const haystack = [event.nome, event.localita, event.provincia, event.asd, ...(event.gare || []).map(g => g.nome)].join(' ').toLocaleLowerCase();
      if (query && !haystack.includes(query)) return false;
      if ($('#locality').value && text(event.localita).trim().toLocaleLowerCase() !== $('#locality').value) return false;
      if ($('#province').value && text(event.provincia).toLowerCase() !== $('#province').value) return false;
      const date = dateValue(event.data);
      if ($('#from-date').value && (!date || date < $('#from-date').value)) return false;
      if ($('#to-date').value && (!date || date > $('#to-date').value)) return false;
      if ($('#weekday').value && text(event.dayofweek).toLowerCase() !== $('#weekday').value) return false;
      const races = event.gare || [];
      if (raceQuery && !races.some(g => text(g.nome).toLocaleLowerCase().includes(raceQuery))) return false;
      if ($('#competitive').checked && !races.some(g => isTrue(g.competitive_id))) return false;
      if ($('#certified').checked && !races.some(g => isTrue(g.certificata))) return false;
      if ($('#national').checked && !races.some(g => isTrue(g.nazionale))) return false;
      return true;
    }
    function link(label, value) {
      const href = safeUrl(value);
      return href ? `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(label)} ↗</a>` : '';
    }
    function renderRace(race) {
      const flags = [isTrue(race.competitive_id) ? t('competitiveBadge') : '', isTrue(race.certificata) ? t('certifiedBadge') : '', isTrue(race.nazionale) ? t('nationalBadge') : ''].filter(Boolean);
      const raceDate = race.data ? `<span>${esc(formatDate(race.data))}</span>` : '';
      const participation = race.partecipazione_nome ? `<span>${esc(race.partecipazione_nome)}</span>` : '';
      const latitude = Number(race.coo_lat);
      const longitude = Number(race.coo_lon);
      const mapLink = Number.isFinite(latitude) && Number.isFinite(longitude)
        ? link(t('map'), `https://www.google.com/maps/place/${latitude},${longitude}`)
        : '';
      const links = [link(t('site'), race.web_site), link('Facebook', race.fb_site), link('Instagram', race.ig_site), link('YouTube', race.youtube_site), link(t('flyer'), race.url_vol), link('GPX', race.url_gpx), link('Relive', race.relive_site), mapLink].filter(Boolean).join('');
      return `<li class="race"><div class="race-title">${esc(race.nome || t('raceUnnamed'))}</div><div class="race-meta">${raceDate ? `<span><span class="meta-icon" aria-hidden="true">◷</span>${raceDate} ${t('start')}</span>` : ''}${participation ? `<span>${participation}</span>` : ''}${flags.map(flag => `<span class="race-status">${esc(flag)}</span>`).join('')}</div>${links ? `<div class="links">${links}</div>` : ''}</li>`;
    }
    function renderEvent(event) {
      const location = [event.localita, event.provincia ? text(event.provincia).toUpperCase() : ''].filter(Boolean).join(' · ');
      const logo = safeUrl(event.asd_logo_url);
      const organizer = event.asd ? `<div class="organizer">${logo ? `<img src="${esc(logo)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ''}<span>${esc(event.asd)}</span></div>` : '';
      const eventLink = link(t('organizerSite'), event.web_site);
      return `<article class="event"><div class="event-top"><div class="event-heading"><h3>${esc(event.nome || t('eventUnnamed'))}</h3><div class="event-meta"><span><span class="meta-icon" aria-hidden="true">◷</span>${esc(formatDate(event.data))} ${t('meetingHour')}</span>${location ? `<span><span class="meta-icon" aria-hidden="true">⌖</span>${esc(location)}</span>` : ''}${event.dayofweek ? `<span>${esc(event.dayofweek)}</span>` : ''}</div></div>${event.anno ? `<span class="badge">${esc(event.anno)}</span>` : ''}</div>${organizer}${eventLink ? `<div class="event-links">${eventLink}</div>` : ''}<ul class="races">${event.gare.map(renderRace).join('')}</ul></article>`;
    }
    function render() {
      const filtered = events.filter(matches).sort((a,b) => text(a.data).localeCompare(text(b.data)));
      const raceTotal = filtered.reduce((n,e) => n + e.gare.length, 0);
      $('#count').textContent = `${filtered.length} ${filtered.length === 1 ? t('event') : t('events')}`;
      $('#race-count').textContent = `${raceTotal} ${raceTotal === 1 ? t('race') : t('races')}`;
      $('#results').innerHTML = filtered.length ? filtered.map(renderEvent).join('') : `<div class="panel empty">${t('noResults')}</div>`;
    }
    $('#file').addEventListener('change', async (event) => {
      const file = event.target.files?.[0]; if (!file) return;
      try { setData(JSON.parse(await file.text()), file.name); }
      catch (error) { status.dataset.statusKey = 'fileError'; status.dataset.statusValues = JSON.stringify({ error: error.message }); status.textContent = t('fileError', { error: error.message }); }
    });
    $('#paste-toggle').addEventListener('click', () => { $('#paste-area').open = !$('#paste-area').open; $('#paste-area').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); });
    $('#load-paste').addEventListener('click', () => {
      try { setData(JSON.parse($('#json-input').value), t('pastedLabel')); }
      catch (error) { status.dataset.statusKey = 'pasteError'; status.dataset.statusValues = JSON.stringify({ error: error.message }); status.textContent = t('pasteError', { error: error.message }); }
    });
    $('#fetch-button').addEventListener('click', async () => {
      status.dataset.statusKey = 'apiLoading'; status.dataset.statusValues = '{}'; status.textContent = t('apiLoading');
      const body = 'Data%5B%5D=%7B%22anno%22%3A%222026%22%2C%22sito%22%3A%221%22%2C%22circ%22%3A%22any%22%2C%22subc%22%3A%22any%22%2C%22presentation%22%3A%22iru%22%2C%22attitude%22%3A%22any%22%2C%22mode%22%3A1%2C%22tab_requested%22%3A-1%7D';
      try {
        const response = await fetch('https://www.irunning.it/api/man.php', {
          method: 'POST',
          credentials: 'include',
          referrer: 'https://www.irunning.it/',
          headers: {
            'Accept': '*/*',
            'Accept-Language': 'it-IT,it;q=0.8',
            'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
            'Priority': 'u=1, i',
            'X-Requested-With': 'XMLHttpRequest'
          },
          body
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const raw = await response.text();
        try { setData(JSON.parse(raw), 'API'); }
        catch { $('#json-input').value = raw; $('#paste-area').open = true; status.dataset.statusKey = 'apiInvalid'; status.dataset.statusValues = '{}'; status.textContent = t('apiInvalid'); }
      } catch (error) {
        status.dataset.statusKey = 'apiError'; status.dataset.statusValues = JSON.stringify({ error: error.message }); status.textContent = t('apiError', { error: error.message });
      }
    });
    ['search','locality','province','from-date','to-date','weekday','race-search','competitive','certified','national'].forEach(id => $(`#${id}`).addEventListener('input', render));
    ['locality','province','weekday','competitive','certified','national'].forEach(id => $(`#${id}`).addEventListener('change', () => {
      if (window.matchMedia('(max-width: 760px)').matches) closeMobileFilters();
    }));
    $('#clear-filters').addEventListener('click', () => {
      ['search','locality','province','from-date','to-date','weekday','race-search'].forEach(id => $(`#${id}`).value = '');
      ['competitive','certified','national'].forEach(id => $(`#${id}`).checked = false);
      render();
      closeMobileFilters();
    });
    function closeMobileFilters() {
      document.body.classList.remove('filters-open');
      $('#mobile-filter-toggle').setAttribute('aria-expanded', 'false');
      $('#filters-panel').setAttribute('aria-hidden', 'true');
    }
    $('#mobile-filter-toggle').addEventListener('click', () => {
      const open = document.body.classList.toggle('filters-open');
      $('#mobile-filter-toggle').setAttribute('aria-expanded', String(open));
      $('#filters-panel').setAttribute('aria-hidden', String(!open));
    });
    $('#filter-scrim').addEventListener('click', closeMobileFilters);
    $('#back-to-top').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    window.addEventListener('scroll', () => {
      $('#back-to-top').classList.toggle('visible', window.scrollY > 400);
    }, { passive: true });
    $('#language').addEventListener('change', event => applyLanguage(event.target.value));
    setTodayAsStartDate();
    applyLanguage('it');
  </script>
</body>
</html>
